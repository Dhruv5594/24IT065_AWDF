name: ITUE301 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-testing:
    name: Backend Tests & Validation (Practical 12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package.json'

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Cache Optimization Benchmark (Practical 9)
        run: node tests/cache-benchmark.js

      - name: Run EventEmitter Pipeline Test (Practical 10)
        run: node tests/event-emitter.test.js

      - name: Run AI Assistant Resilience Test (Practical 13)
        run: node tests/ai-integration.test.js

  frontend-build:
    name: Frontend Build & Code-Splitting Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Production Frontend with Vite (Practical 8)
        run: npm run build

  pipeline-summary:
    name: CI/CD Pipeline Status Report
    needs: [backend-testing, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report Pipeline Outcome
        run: |
          if [ "${{ needs.backend-testing.result }}" = "success" ] && [ "${{ needs.frontend-build.result }}" = "success" ]; then
            echo "========================================================"
            echo "  CI/CD PIPELINE STATUS: [PASSED]"
            echo "  All backend tests passed and frontend build succeeded!"
            echo "========================================================"
            exit 0
          else
            echo "========================================================"
            echo "  CI/CD PIPELINE STATUS: [FAILED]"
            echo "  One or more jobs encountered an error. Check logs above."
            echo "========================================================"
            exit 1
          fi
