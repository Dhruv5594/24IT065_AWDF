services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: itue301-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Express & Node.js REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itue301-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/itue301_db
      - JWT_SECRET=itue301_super_secret_jwt_key_2026_charusat
      - JWT_EXPIRES_IN=7d
      - CACHE_TTL=60
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - awdf-network

  # 3. React SPA Frontend & Nginx Reverse Proxy Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itue301-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - awdf-network

# Persistent volume for MongoDB data (survives container down/rebuild)
volumes:
  mongo-data:
    name: itue301_mongo_data

# Isolated bridge network for internal inter-container communication
networks:
  awdf-network:
    name: itue301_network
    driver: bridge
